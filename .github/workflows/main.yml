name: Build Madworld (Windows VST3)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Madworld-VST3-Windows
          path: build/Madworld_artefacts/Release/VST3/Madworld.vst3

      - name: Upload Standalone
        uses: actions/upload-artifact@v4
        with:
          name: Madworld-Standalone-Windows
          path: build/Madworld_artefacts/Release/Standalone/Madworld.exe
